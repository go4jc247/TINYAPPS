<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0025b8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Runner">
<title>App Runner</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e3e6ea;--ac:#0025b8;--ok:#1a7f37;--bad:#cf222e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e6e9ee;--mut:#8b94a3;--bd:#262c36;--ac:#4c8dff;--ok:#3fb950;--bad:#f85149}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#setup{max-width:720px;margin:0 auto;padding:18px 14px;display:grid;gap:12px}
h1{font-size:22px;margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.mut{color:var(--mut);font-size:14px}
textarea{width:100%;min-height:220px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);resize:vertical}
.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#msg{min-height:20px;font-size:14px;margin-top:8px}
.bad{color:var(--bad)}.ok{color:var(--ok)}
#menuBtn{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px;line-height:32px;padding:0;opacity:.35;z-index:5;cursor:pointer}
#menuBtn:hover,#menuBtn:focus{opacity:.9}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#sheet .in{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;display:grid;gap:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:56px;background:#000c;color:#fff;padding:8px 14px;border-radius:9px;font-size:14px;z-index:20}
</style>
</head>
<body>

<div id="setup" hidden>
  <h1>App Runner</h1>
  <div class="card">
    <p style="margin-top:0">Paste the HTML of your app, or choose an HTML or text file. This copy then becomes that app and opens it every time, with no prompt.</p>
    <textarea id="paste" placeholder="Paste the full HTML here…" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn" id="pickBtn">Choose file…</button>
      <input type="file" id="file" accept=".html,.htm,.txt,text/html,text/plain" hidden>
      <button class="btn p" id="saveBtn">Save and run</button>
    </div>
    <div id="msg"></div>
    <p class="mut" style="margin-bottom:0">Saved only on this device. Its data is saved automatically too.</p>
  </div>
  <div class="row" style="justify-content:center;margin-top:0">
    <a class="btn" id="homeLink" href="../">← Back to Tiny Apps</a>
  </div>
</div>

<iframe id="frame" hidden title="App"
  sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
<button id="menuBtn" hidden aria-label="Runner menu">⋯</button>

<div id="sheet" hidden>
  <div class="in">
    <strong>App Runner</strong>
    <div class="mut" id="info"></div>
    <button class="btn p" id="bkBtn">Save backup (code + data)</button>
    <button class="btn" id="rsBtn">Restore backup</button>
    <input type="file" id="rsFile" accept="application/json,.json" hidden>
    <a class="btn" id="homeLink2" href="../" style="text-align:center">← Back to Tiny Apps</a>
    <button class="btn" id="closeBtn">Close</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// Each copy of this runner lives in its own folder; the folder name is its storage slot.
const dirs = location.pathname.split('/').filter(Boolean);
if (dirs.length && /\.[a-z0-9]+$/i.test(dirs[dirs.length - 1])) dirs.pop();
const SLOT = (dirs.pop() || 'root').toLowerCase();
const K_CODE = 'runner:' + SLOT + ':code', K_STATE = 'runner:' + SLOT + ':state';

const getLS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
function setLS(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function readState() { try { const s = JSON.parse(getLS(K_STATE) || '{}'); return s && typeof s === 'object' ? s : {}; } catch (e) { return {}; } }

let curState = readState(), pending = null, timer = 0;
function toast(t) {
  const d = document.createElement('div'); d.id = 'toast'; d.textContent = t; document.body.appendChild(d);
  setTimeout(() => d.remove(), 3500);
}
function flush() {
  clearTimeout(timer);
  if (pending === null) return;
  const ok = setLS(K_STATE, JSON.stringify(pending));
  pending = null;
  if (!ok) toast('Could not save: storage is full or blocked');
}
addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

// ---- Runs inside the pasted app (before its own scripts). Gives it a saved localStorage and
// ---- hands link clicks to the runner. Must be self-contained: it is converted to text.
function shim(S) {
  function post(m) { try { m.runner = 1; parent.postMessage(m, '*'); } catch (e) {} }
  function mk(persist) {
    var d = persist ? S : {};
    var api = {
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(d, k) ? d[k] : null; },
      setItem: function (k, v) { d[k] = String(v); if (persist) post({ t: 'save', state: d }); },
      removeItem: function (k) { delete d[k]; if (persist) post({ t: 'save', state: d }); },
      clear: function () { for (var k in d) delete d[k]; if (persist) post({ t: 'save', state: d }); },
      key: function (i) { return Object.keys(d)[i] || null; }
    };
    Object.defineProperty(api, 'length', { get: function () { return Object.keys(d).length; } });
    return api;
  }
  try { Object.defineProperty(window, 'localStorage', { value: mk(true), configurable: true }); } catch (e) {}
  try { Object.defineProperty(window, 'sessionStorage', { value: mk(false), configurable: true }); } catch (e) {}
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button) return;
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var h = a.getAttribute('href');
    if (!h || h.charAt(0) === '#' || /^(javascript|mailto|tel|blob|data):/i.test(h)) return;
    e.preventDefault();
    post({ t: 'open', href: h });
  }, false);
}
function inject(code, state) {
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  const tag = '<script>(' + shim.toString() + ')(' + json + ');<\/script>';
  let m;
  if ((m = code.match(/<head[^>]*>/i))) return code.slice(0, m.index + m[0].length) + tag + code.slice(m.index + m[0].length);
  if ((m = code.match(/^\s*<!doctype[^>]*>\s*(<html[^>]*>)?/i))) return code.slice(0, m[0].length) + tag + code.slice(m[0].length);
  if ((m = code.match(/<html[^>]*>/i))) return code.slice(0, m.index + m[0].length) + tag + code.slice(m.index + m[0].length);
  return tag + code;
}

const frame = $('frame');
function run(code) {
  curState = readState();
  frame.srcdoc = inject(code, curState);
  frame.hidden = false; $('menuBtn').hidden = false; $('setup').hidden = true;
  const t = code.match(/<title[^>]*>([^<]*)<\/title>/i);
  document.title = (t && t[1].trim()) || 'App Runner';
}

addEventListener('message', e => {
  if (e.source !== frame.contentWindow) return;
  const d = e.data;
  if (!d || !d.runner) return;
  if (d.t === 'save' && d.state && typeof d.state === 'object') {
    curState = d.state; pending = d.state;
    clearTimeout(timer); timer = setTimeout(flush, 400);
  } else if (d.t === 'open' && typeof d.href === 'string') {
    let u; try { u = new URL(d.href, location.href); } catch (err) { return; }
    if (!/^https?:$/.test(u.protocol)) return;
    if (u.origin === location.origin) { flush(); location.href = u.href; }
    else window.open(u.href, '_blank', 'noopener');
  }
});

// ---- first launch: paste or choose a file
$('pickBtn').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('paste').value = await f.text(); $('msg').textContent = f.name + ' loaded. Tap Save and run.'; e.target.value = '';
};
$('saveBtn').onclick = () => {
  const code = $('paste').value;
  if (code.trim().length < 20 || code.indexOf('<') < 0) { $('msg').innerHTML = '<span class="bad">That doesn\'t look like HTML.</span>'; return; }
  if (!setLS(K_CODE, code)) { $('msg').innerHTML = '<span class="bad">Could not save: too large or storage blocked.</span>'; return; }
  run(code);
};
function goHome(e) {
  const unsaved = !$('setup').hidden && $('paste').value.trim();
  if (!confirm(unsaved ? 'Leave? The HTML you pasted has not been saved.' : 'Go back to the Tiny Apps home?')) e.preventDefault();
  else flush();
}
$('homeLink').addEventListener('click', goHome);
$('homeLink2').addEventListener('click', goHome);

// ---- small menu: backup and restore
$('menuBtn').onclick = () => {
  const kb = n => (n / 1024).toFixed(1) + ' KB';
  $('info').textContent = 'Slot: ' + SLOT + ' · app ' + kb((getLS(K_CODE) || '').length) + ' · data ' + kb(JSON.stringify(curState).length);
  $('sheet').hidden = false;
};
$('closeBtn').onclick = () => { $('sheet').hidden = true; };
$('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').hidden = true; };
$('bkBtn').onclick = () => {
  flush();
  const data = { runner: 1, slot: SLOT, savedAt: new Date().toISOString(), code: getLS(K_CODE) || '', state: curState };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = SLOT + '-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('rsBtn').onclick = () => $('rsFile').click();
$('rsFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || d.runner !== 1 || typeof d.code !== 'string' || !d.code) throw new Error('Not a runner backup');
    if (!confirm('Replace this app and its data with the backup from ' + (d.savedAt || 'unknown date') + '?')) return;
    if (!setLS(K_CODE, d.code) || !setLS(K_STATE, JSON.stringify(d.state || {}))) throw new Error('Could not save (storage full)');
    location.reload();
  } catch (err) { alert('Restore failed: ' + err.message); }
  e.target.value = '';
};

// ---- start
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
}
const saved = getLS(K_CODE);
if (saved) run(saved); else $('setup').hidden = false;
</script>
</body>
</html>
