<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0025b8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tiny Apps">
<title>Tiny Apps</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e3e6ea;--ac:#1f6feb;--ok:#1a7f37}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e6e9ee;--mut:#8b94a3;--bd:#262c36;--ac:#4c8dff;--ok:#3fb950}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 14px}
h1{font-size:24px;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.list{display:grid;gap:12px}
a.app{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;color:inherit;text-decoration:none}
a.app:active,a.app:hover{border-color:var(--ac)}
.ic{font-size:30px;width:56px;height:56px;display:grid;place-items:center;background:var(--bg);border-radius:13px;flex:none;overflow:hidden}
.ic img{width:100%;height:100%;display:block}
.nm{font-weight:600}
.ds{color:var(--mut);font-size:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;color:var(--mut);font-size:13px}
.btn{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:9px;cursor:pointer}
.ok{color:var(--ok)}
</style>
</head>
<body>
<main>
  <h1>Tiny Apps</h1>
  <p class="sub">Small offline tools. Tap one to open it.</p>
  <div class="list" id="list"></div>
  <div class="bar"><span id="st"></span><button class="btn" id="upd">Check for updates</button></div>
</main>
<script>
// ADD A NEW APP: put it in its own folder (index.html, sw.js, manifest.webmanifest, icon.png),
// then add one entry here. The tile icon is always that folder's own icon.png (file + 'icon.png'). `files` = everything the app needs offline (so the hub can keep it fresh).
const APPS = [
  {
    name: 'Loan Tracker', file: 'loan/',
    desc: 'Paste loan details, track changes over time',
    files: ['loan/', 'loan/index.html', 'loan/manifest.webmanifest', 'loan/icon.png']
  },
];
const HUB_FILES = ['./', 'index.html', 'manifest.webmanifest', 'icon.png'];
const CACHE = 'tiny-apps'; // same name every worker in this repo uses
const STAMP = 'tinyApps.lastUpdate';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
$('list').innerHTML = APPS.map(a =>
  '<a class="app" href="' + esc(a.file) + '"><div class="ic">' +
  '<img src="' + esc(a.file + 'icon.png') + '" alt="" onerror="this.replaceWith(\'📦\')">' +
  '</div><div><div class="nm">' + esc(a.name) + '</div><div class="ds">' + esc(a.desc || '') + '</div></div></a>'
).join('');

function lastText() {
  try { const t = +localStorage.getItem(STAMP); return t ? new Date(t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : ''; } catch (e) { return ''; }
}
// Re-download the hub and every app's files, bypassing the HTTP cache, and store them in the shared cache.
async function refresh() {
  if (!('caches' in window) || !/^https?:$/.test(location.protocol)) { $('st').textContent = 'Offline saving needs the hosted version.'; return; }
  $('st').textContent = 'Checking…';
  const urls = HUB_FILES.concat(APPS.flatMap(a => a.files || [a.file]));
  let ok = 0;
  try {
    const c = await caches.open(CACHE);
    await Promise.all(urls.map(async u => {
      try { const r = await fetch(u, { cache: 'reload' }); if (r.ok) { await c.put(u, r); ok++; } } catch (e) {}
    }));
  } catch (e) {}
  if (ok === urls.length) {
    try { localStorage.setItem(STAMP, Date.now()); } catch (e) {}
    $('st').innerHTML = '<span class="ok">Everything is up to date and saved offline.</span>';
  } else if (ok === 0) {
    $('st').textContent = 'Offline. Using saved copies' + (lastText() ? ' (updated ' + lastText() + ').' : '.');
  } else {
    $('st').textContent = 'Partly updated (' + ok + ' of ' + urls.length + ' files). Try again.';
  }
}
$('upd').onclick = refresh;
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
}
refresh();
</script>
</body>
</html>
