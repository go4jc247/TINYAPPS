<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f6feb">
<title>Tiny Apps</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e3e6ea}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e6e9ee;--mut:#8b94a3;--bd:#262c36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}
main{max-width:720px;margin:0 auto;padding:14px;display:grid;gap:12px}
a.app{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;color:inherit;text-decoration:none}
a.app img{width:48px;height:48px;border-radius:10px}
.n{font-weight:600}
.d{font-size:14px;color:var(--mut)}
</style>
</head>
<body>
<header><h1>Tiny Apps</h1></header>
<main id="list"></main>
<script>
const APPS = [
  { name: 'Loan Tracker', file: 'loan/', icon: 'loan/icon.png', desc: 'Paste loan account text, track changes between snapshots.' }
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('list').innerHTML = APPS.map(a =>
  '<a class="app" href="' + esc(a.file) + '"><img src="' + esc(a.icon) + '" alt="">' +
  '<div><div class="n">' + esc(a.name) + '</div><div class="d">' + esc(a.desc) + '</div></div></a>').join('');
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
}
</script>
</body>
</html>
